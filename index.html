<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Game 2D</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <div class="game-wrap">
        <div class="scene" id="scene" aria-label="Cena do jogo">
          <div class="sky"></div>
          <div class="sun"></div>
          <div class="cloud cloud-a"></div>
          <div class="cloud cloud-b"></div>
          <div class="cloud cloud-c"></div>

          <div class="tv tv-1" data-name="TV 1">
            <div class="tv-frame">
              <img src="Imagens/tv.jpeg" alt="TV 1" />
            </div>
          </div>

          <div class="tv tv-2" data-name="TV 2">
            <div class="tv-frame">
              <img src="Imagens/tv.jpeg" alt="TV 2" />
            </div>
          </div>

          <div class="tv tv-3" data-name="TV 3">
            <div class="tv-frame">
              <img src="Imagens/tv.jpeg" alt="TV 3" />
            </div>
          </div>

          <div class="tv tv-4" data-name="TV 4">
            <div class="tv-frame">
              <img src="Imagens/tv.jpeg" alt="TV 4" />
            </div>
          </div>

          <div class="ground"></div>

          <div class="player" id="player" aria-label="Personagem principal">
            <img src="Imagens/personagem.jpeg" alt="Personagem" />
          </div>

          <div class="message" id="message" hidden></div>
        </div>

        <div class="controls-bar">
          <div class="key">←</div>
          <div class="key">→</div>
          <span>Setas para andar</span>
          <div class="divider"></div>
          <div class="key">Espaço</div>
          <span>Pular</span>
          <div class="divider"></div>
          <div class="key">🖱</div>
          <span>Clique para interagir</span>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
